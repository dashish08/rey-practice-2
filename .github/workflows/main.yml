name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверка стиля (flake8)
        run: flake8 .

      - name: Запуск тестов
        run: pytest -v

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Сгенерировать документацию
        run: python -m pdoc task_manager -o docs_html

      - name: Сохранить документацию
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs_html
